AboutText = Rmemu\r\n\r\nWindows 右键菜单管理 · .NET 10 Windows Forms\r\n\r\n支持 Windows 10 / 11，浅色、深色和跟随系统主题。\r\n可搜索菜单来源，保存启停记录，并在支持范围内撤销。\r\n现代扩展诊断读取 AppX/MSIX 清单与 ExplorerCommandHandler 注册。\r\n\r\n基于 ContextMenuManager，原作者：蓝点 lilac。\r\n来源：https://github.com/iron-water/ContextMenuManager\r\n原项目：https://github.com/BluePointLilac/ContextMenuManager\r\n许可证：MIT。原作者署名与资源说明保留在项目中。\r\n\r\n自包含发布可免装 .NET；WinForms Native AOT 不属于受支持方案。
