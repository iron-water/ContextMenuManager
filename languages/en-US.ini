AboutText = Rmemu\r\n\r\nWindows context menu manager · .NET 10 Windows Forms\r\n\r\nSupports Windows 10 / 11 with light, dark and system themes.\r\nSearch menu sources, keep a history of enable/disable changes and undo them where supported.\r\nModern extension diagnostics read AppX/MSIX manifests and ExplorerCommandHandler registrations.\r\n\r\nBased on ContextMenuManager by BluePointLilac.\r\nSource: https://github.com/iron-water/ContextMenuManager\r\nOriginal project: https://github.com/BluePointLilac/ContextMenuManager\r\nLicense: MIT. Original attribution and resource credits are kept in the project.\r\n\r\nSelf-contained builds need no .NET install; WinForms Native AOT is not supported.
